# Template: alerts at your towers plus alerts along the lanes seen by the
# patrolling robot. Expected alerts ~= rate_per_hour x hours_per_day x days
# (here 5 days x 4 h = 20 operating hours).
name: Towers and patrol
source: sim
days: 5
hours_per_day: 4
start_hour: 13
seed: 11

devices:
  - id: iot-01
    at: [0, 0]          # your tower poses (map-frame x, y)
  - id: iot-02
    at: [2, 83]
  - id: husky-sim-01
    type: robot         # robots move, so no `at`

hotspots:
  - name: iot-01 area   # 2.5/h x 20 h ~= 50 alerts
    at: [0, 0]
    radius_m: 3
    rate_per_hour: 2.5
  - name: iot-02 area   # 2.5/h x 20 h ~= 50 alerts
    at: [2, 83]
    radius_m: 3
    rate_per_hour: 2.5

background:             # 2.5/h x 20 h ~= 50 alerts along the lanes
  rate_per_hour: 2.5
  device: husky-sim-01  # detected by the robot, not the nearest tower
