[project]
name = "mission-manager-backend"
version = "0.1.0"
requires-python = ">=3.10"

# Install with pip >= 25.1: `pip install --group app` (Docker), `--group dev`
# (tests, lint, figures) or `--group analyzer` (tools/analyzer).
[dependency-groups]
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "eclipse-zenoh>=1.0",
    "lanelet2",
    "pyproj",
    "numpy>=1.26",
    "icmplib>=3.0",
]
analyzer = [
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]
dev = [
    { include-group = "app" },
    { include-group = "analyzer" },
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.17",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's Depends() in default arguments is the intended idiom.
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette's TestClient nags about its httpx backend; not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
