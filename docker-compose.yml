services:
  backend:
    build:
      context: ./backend
    # Host networking (not bridge) so Zenoh's default multicast-based peer
    # discovery works when ZENOH_ENABLED=true later — Docker's bridge network
    # doesn't pass multicast through without extra config. This also means no
    # `ports:` mapping is needed below; the container shares the host's
    # network stack directly. Linux-only — not supported the same way on
    # Docker Desktop for Mac/Windows.
    network_mode: host
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:5050"]
      - MAP_OSM_PATH=storage/maps/lanelet2_map.osm
      - MAP_PROJECTOR_PATH=storage/maps/map_projector_info.yaml
      - MISSION_FOLDER=storage/missions
      - APP_STATE_PATH=storage/app_state.yaml
      - DEVICE_OFFLINE_TIMEOUT_SEC=3.0
      - DEVICE_MONITOR_INTERVAL_SEC=1.0
      - ZENOH_ENABLED=${ZENOH_ENABLED:-false}
      - ZENOH_ROUTER=${ZENOH_ROUTER:-tcp/localhost:7447}
      - ZENOH_DEVICE_STATE_KEYEXPR=mission-manager/devices/*/state
      # Off by default — matches backend/.env.example. Set SIMULATOR_ENABLED=true
      # in a root .env (see .env.example) for a local demo with fake devices.
      - SIMULATOR_ENABLED=${SIMULATOR_ENABLED:-false}
      - SIMULATOR_TICK_INTERVAL_SEC=0.5
      - SIMULATOR_FIXTURES_PATH=simulation/fixtures/devices.yaml
      - SIMULATOR_ROBOT_DEVICE_ID=sim-robot-01
      - SIMULATOR_ROBOT_SPEED_MPS=1.0
      - SIMULATOR_IOT_DEVICE_IDS=["sim-iot-01","sim-iot-02","sim-iot-03"]
      - SIMULATOR_IOT_FLAP_MIN_SEC=15.0
      - SIMULATOR_IOT_FLAP_MAX_SEC=45.0
      - SIMULATOR_IOT_FLAP_DURATION_SEC=6.0
      - SIMULATOR_ANOMALY_MIN_INTERVAL_SEC=20.0
      - SIMULATOR_ANOMALY_MAX_INTERVAL_SEC=60.0
      - SIMULATOR_ANOMALY_OFFSET_M=1.5
    volumes:
      # Map data: read-only, swap in a different map without rebuilding the image.
      - ./backend/storage/maps:/app/storage/maps:ro
      # Mission/app-state data: read-write and persisted on the host, so
      # missions created/edited through the app survive container recreation.
      - ./backend/storage/missions:/app/storage/missions
      - ./backend/storage/app_state.yaml:/app/storage/app_state.yaml
      # Dev-simulator device fixtures — edit on the host, restart the
      # container to pick up changes (loaded once at DevSimulator startup).
      - ./backend/simulation/fixtures:/app/simulation/fixtures:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5050:80"
    environment:
      # These are baked into /config.js at container start (see
      # docker-entrypoint.sh) and read by the BROWSER, not proxied through
      # nginx — so they must be reachable from wherever the browser runs, not
      # just from inside the frontend container. "localhost" is correct when
      # viewing the page from the same machine Docker runs on; for a real
      # robot deployment, override via a root .env (see .env.example), e.g.
      # API_BASE_URL=http://robot-host:8000.
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
      - WS_URL=${WS_URL:-ws://localhost:8000/ws}
      - CAMERA_MODE=${CAMERA_MODE:-mock}
    depends_on:
      - backend
    restart: unless-stopped
