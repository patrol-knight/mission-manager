services:
  zenohd:
    image: eclipse/zenoh:latest
    ports:
      - "7447:7447"
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - zenohd
    # Settings come from the root .env; see .env.example.
    environment:
      - CORS_ORIGINS=["http://${PUBLIC_HOST:-localhost}:5050","http://localhost:5050","http://localhost:5173"]
      - RUNS_DIR=/data/runs
      - RUNS_OWNER=${HOST_UID:-1000}:${HOST_GID:-1000}
      - MAP_OSM_PATH=storage/maps/${MAP:-nsh}/lanelet2_map.osm
      - MAP_PROJECTOR_PATH=storage/maps/${MAP:-nsh}/map_projector_info.yaml
      - ZENOH_ENABLED=${ZENOH_ENABLED:-false}
      - ZENOH_ROUTER=tcp/zenohd:7447
    volumes:
      # The whole folder, not single files: app_state.yaml is saved with
      # os.replace(), which fails on a file bind mount.
      - ./backend/storage:/app/storage
      - ./backend/storage/maps:/app/storage/maps:ro
      - ./data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5050:80"
    depends_on:
      - backend
    # Used by the browser, so they must be reachable from where the UI is opened.
    environment:
      - API_BASE_URL=http://${PUBLIC_HOST:-localhost}:8000
      - WS_URL=ws://${PUBLIC_HOST:-localhost}:8000/ws
    restart: unless-stopped
